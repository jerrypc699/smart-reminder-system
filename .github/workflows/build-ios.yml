name: Build Dr. Abdelaziz iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (xcodebuild)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r DrAbdelaziz-Reminder-v1.0.56.ipa Payload
          cp DrAbdelaziz-Reminder-v1.0.56.ipa DrAbdelaziz-Reminder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder-v1.0.56.ipa
          path: DrAbdelaziz-Reminder-v1.0.56.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release v1.0.56
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.56
          name: "Dr. Abdelaziz Smart Reminder App v1.0.56"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز — الإصدار v1.0.56
            
            التحديثات الجديدة:
            - إصلاح وتخصيص تقارير الفترات الزمنية المحددة في «نظامي» لتعزل بيانات الفترة بدقة تامة وبدون تسريب أو الخلط مع التقرير الشهري الشامل
            - إضافة خيار تفاعلي صريح للتحكم في تضمين مهام العمل في التقارير (إلغاء التضمين تلقائياً لتقارير الفترات والأيام، أو تفعيله بفلترة مقتصرة على مهام الفترة فقط)
            - تصحيح شارة الهيدر العلوي لملف PDF لتعكس تاريخ ونطاق الفترة المحددة بالتفصيل
            - عزل مراجعات الشهر عن تقارير الفترات وقصر الملاحظات على ما تم تسجيله داخل أيام الفترة فقط
            - ضبط زر تصدير PDF في أعلى «نظامي» ليتعرف تلقائياً على التبويب والوضع المعروض (فترة مخصصة، يوم محدد، أو خريطة الشهر)
          files: |
            DrAbdelaziz-Reminder-v1.0.56.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Dr. Abdelaziz Smart Reminder App (Latest)"
          files: |
            DrAbdelaziz-Reminder-v1.0.56.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

