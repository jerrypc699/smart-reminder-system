name: Build Dr. Abdelaziz Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x ./android/gradlew

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Dr. Abdelaziz Smart Reminder App v1.0.0 (Android APK)"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز
            - يعمل الأذان بصوت الشيخ مشاري العفاسي في مواقيت الصلاة حتى لو كان الهاتف مقفلاً.
            - تنبيهات مهام العمل والعيادة.
            - تشغيل أصلي عبر نظام منبهات أندرويد المباشر (Exact Alarm).
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
