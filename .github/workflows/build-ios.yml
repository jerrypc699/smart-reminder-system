name: Build Dr. Abdelaziz iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (xcodebuild)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r DrAbdelaziz-Reminder-v1.0.48.ipa Payload
          cp DrAbdelaziz-Reminder-v1.0.48.ipa DrAbdelaziz-Reminder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder-v1.0.48.ipa
          path: DrAbdelaziz-Reminder-v1.0.48.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release v1.0.48
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.48
          name: "Dr. Abdelaziz Smart Reminder App v1.0.48"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز — الإصدار v1.0.48
            
            التحديثات الجديدة:
            - إضافة باب وقسم «أذكار مخصصة ✍️» بارز في واجهة الأذكار مع 3 أدعية افتراضية وإمكانية إضافة وتعديل وحفظ الأذكار الخاصة بسعادة الدكتور عبد العزيز وسماعها وتكرارها.
            - مهام داخلية مجدولة ومواعيد مخصصة وتنبيهات صوتية لكل عادة في «نظامي» (شرب الماء: توزيع ومواعيد الأكواب الـ 8 ومنبه صوتي لكل كوب، القرآن، الرياضة، المذاكرة، النوم).
            - دعم التكليف الجماعي للمهام في واتساب لعدة أشخاص أو فريق عمل ومشاركة بطاقة التكليف الرسمية مباشرة إلى جروب واتساب أو إرسال فردي سريع بنقرة واحدة لكل مكلف.
          files: |
            DrAbdelaziz-Reminder-v1.0.48.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Dr. Abdelaziz Smart Reminder App (Latest)"
          files: |
            DrAbdelaziz-Reminder-v1.0.48.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Dr. Abdelaziz Smart Reminder App (Latest)"
          files: |
            DrAbdelaziz-Reminder-v1.0.44.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

