<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Emblem Ring -->
  <circle cx="256" cy="235" r="150" fill="#131C31" stroke="url(#emeraldGrad)" stroke-width="7" filter="url(#glow)" />
  <circle cx="256" cy="235" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Crescent & Star / Clock motif -->
  <path d="M 285 140 A 95 95 0 1 0 310 290 A 80 80 0 1 1 285 140 Z" fill="url(#goldGrad)" />
  <circle cx="310" cy="180" r="12" fill="#34D399" />

  <!-- Sound / Pulse Waves -->
  <path d="M 185 245 C 190 230 190 220 185 205" stroke="#34D399" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 172 255 C 180 230 180 215 172 195" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Text Label -->
  <text x="256" y="380" font-family="'Cairo', 'Tajawal', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    د. عبد العزيز
  </text>
  <text x="256" y="420" font-family="'Cairo', 'Tajawal', sans-serif" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">
    المساعد الشخصي الذكي
  </text>
</svg>

