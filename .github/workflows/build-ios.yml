name: Build Dr. Abdelaziz iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (xcodebuild)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r DrAbdelaziz-Reminder.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder.ipa
          path: DrAbdelaziz-Reminder.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Dr. Abdelaziz Smart Reminder App v1.0.0"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز
            - متاح بصيغة Android APK لأجهزة الأندرويد.
            - متاح بصيغة iOS IPA لأجهزة الآيفون والآيباد (تثبيت عبر Sideloadly أو AltStore).
          files: DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
