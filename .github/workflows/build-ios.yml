name: Build Dr. Abdelaziz iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (xcodebuild)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r DrAbdelaziz-Reminder-v1.0.57.ipa Payload
          cp DrAbdelaziz-Reminder-v1.0.57.ipa DrAbdelaziz-Reminder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder-v1.0.57.ipa
          path: DrAbdelaziz-Reminder-v1.0.57.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release v1.0.57
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.57
          name: "Dr. Abdelaziz Smart Reminder App v1.0.57"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز — الإصدار v1.0.57
            
            التحديثات الجديدة:
            - إضافة مكتبة فيديوهات متكاملة داخل «أذكاري» مع رفع وتشغيل وتعديل أسماء الفيديوهات أو إرفاق فيديو مباشرة بكل ذكر
            - إتاحة تعديل كافة الأذكار (الأساسية والمخصصة) نصاً وعنواناً وتكراراً وفضلاً، مع إمكانية تعديل عناوين أقسام وأبواب الأذكار مباشرة
            - إضافة محرر كامل لبطاقة التكليف الرسمية قبل إرسالها كصورة على واتساب (تعديل العنوان والموضوع والمرسل والتاريخ والتحية والمهمة والمطلوب والتوجيه والختام) مع تحديث الصورة تلقائياً
            - إضافة القواعد والممنوعات الغذائية بتنبيه صوتي مجدول تحت «الصحة والراحة» في «نظامي» مع أمثلة جاهزة (ممنوع العيش بعد الساعة ٨ مساءً، وممنوع السكريات والحلويات) وإمكانية إضافة وتعديل أي قاعدة صحية أخرى
          files: |
            DrAbdelaziz-Reminder-v1.0.57.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Dr. Abdelaziz Smart Reminder App (Latest)"
          files: |
            DrAbdelaziz-Reminder-v1.0.57.ipa
            DrAbdelaziz-Reminder.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

