name: Build Dr. Abdelaziz Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x ./android/gradlew

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Versioned APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DrAbdelaziz-Reminder-v1.0.57.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk DrAbdelaziz-Reminder.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder-v1.0.57.apk
          path: DrAbdelaziz-Reminder-v1.0.57.apk
          retention-days: 30

      - name: Create or Update GitHub Release v1.0.57
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.57
          name: "Dr. Abdelaziz Smart Reminder App v1.0.57"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز — الإصدار v1.0.57
            
            التحديثات الجديدة:
            - إضافة مكتبة فيديوهات متكاملة داخل «أذكاري» مع رفع وتشغيل وتعديل أسماء الفيديوهات أو إرفاق فيديو مباشرة بكل ذكر
            - إتاحة تعديل كافة الأذكار (الأساسية والمخصصة) نصاً وعنواناً وتكراراً وفضلاً، مع إمكانية تعديل عناوين أقسام وأبواب الأذكار مباشرة
            - إضافة محرر كامل لبطاقة التكليف الرسمية قبل إرسالها كصورة على واتساب (تعديل العنوان والموضوع والمرسل والتاريخ والتحية والمهمة والمطلوب والتوجيه والختام) مع تحديث الصورة تلقائياً
            - إضافة القواعد والممنوعات الغذائية بتنبيه صوتي مجدول تحت «الصحة والراحة» في «نظامي» مع أمثلة جاهزة (ممنوع العيش بعد الساعة ٨ مساءً، وممنوع السكريات والحلويات) وإمكانية إضافة وتعديل أي قاعدة صحية أخرى
          files: |
            DrAbdelaziz-Reminder-v1.0.57.apk
            DrAbdelaziz-Reminder.apk
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Dr. Abdelaziz Smart Reminder App (Latest)"
          files: |
            DrAbdelaziz-Reminder-v1.0.57.apk
            DrAbdelaziz-Reminder.apk
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
