name: Build Dr. Abdelaziz Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x ./android/gradlew

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Versioned APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DrAbdelaziz-Reminder-v1.0.34.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk DrAbdelaziz-Reminder.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrAbdelaziz-Reminder-v1.0.34.apk
          path: DrAbdelaziz-Reminder-v1.0.34.apk
          retention-days: 30

      - name: Create or Update GitHub Release v1.0.34
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.34
          name: "Dr. Abdelaziz Smart Reminder App v1.0.34"
          body: |
            تطبيق نظام التذكير الذكي ومواقيت الصلاة للدكتور عبد العزيز — الإصدار v1.0.34
            - ضبط وتثبيت ساعة الحائط الملكية الذهبية بدقة فيكتور SVG كاملة مع عقارب فاخرة (ساعات، دقائق، ثواني) مستحيلة التأثر بوضع الدارك مود مع محاذاة دائرية وحساب مثلثي فائق الدقة.
            - إضافة كبسولة الوقت الرقمي الحي المباشر (ساعة : دقيقة : ثانية مع ص/م) أسفل ساعة الحائط مباشرة لضمان الدقة المطلقة.
            - إضافة صلاة الضحى (سنة مؤكدة) وقيام الليل (الثلث الأخير) بجدول مواقيت الصلاة بتوقيتها الفلكي الدقيق وتمييزها في العد التنازلي.
          files: |
            DrAbdelaziz-Reminder-v1.0.34.apk
            DrAbdelaziz-Reminder.apk
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Latest Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Dr. Abdelaziz Smart Reminder App (Latest)"
          files: |
            DrAbdelaziz-Reminder-v1.0.34.apk
            DrAbdelaziz-Reminder.apk
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
