name: 24/7 Prayer Check Pulse

on:
  schedule:
    # Run every 5 minutes around the clock
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-prayer:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Prayer API
        run: |
          curl -sS -m 20 "https://smart-reminder-system-nu.vercel.app/api/cron-prayer-check" || true
